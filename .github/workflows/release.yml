# Publishes Maven artifacts (typically to Maven Central via OSSRH / Central Portal).
# Prerequisites in the POM: distributionManagement, GPG signing (for releases), and
# compatible plugins. Set GitHub Environments + secrets before enabling deploy.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (informational; use Git tags for real releases)'
        required: false
        type: string
      publish_to_maven_central:
        description: 'Run mvn deploy (requires Maven Central / OSSRH secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw -B -ntp verify
          elif command -v mvn >/dev/null 2>&1; then
            mvn -B -ntp verify
          else
            echo "Add the Maven Wrapper (mvn -N wrapper:wrapper) or install Maven."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-targets
          path: '**/target/*.jar'
          if-no-files-found: ignore
          retention-days: 30

  publish-maven-central:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_maven_central == 'true')
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Server id must match <distributionManagement><repository><id> in the root POM (often ossrh).
      # Repository secrets: MAVEN_USERNAME, MAVEN_PASSWORD (OSSRH / Central token user),
      # MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE for signed artifacts.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          # Name of the env var holding the passphrase (not the passphrase itself).
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw -B -ntp deploy -Prelease -DskipTests
          else
            mvn -B -ntp deploy -Prelease -DskipTests
          fi
