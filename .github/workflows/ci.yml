name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PRs and merges to main: Ubuntu only (JDK matrix).
  build-ubuntu:
    name: Build and test — Ubuntu (JDK ${{ matrix.java-version }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw -B -ntp verify
          elif command -v mvn >/dev/null 2>&1; then
            mvn -B -ntp verify
          else
            echo "Add the Maven Wrapper to the repo (mvn -N wrapper:wrapper) or install Maven on the runner."
            exit 1
          fi

      - name: Upload JaCoCo reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-ubuntu-jdk-${{ matrix.java-version }}
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: |
            **/target/site/jacoco/jacoco.xml
          flags: unittests
          fail_ci_if_error: false

  # Windows: manual runs only (Actions → CI → Run workflow).
  build-windows-manual:
    name: Build and test — Windows (JDK 17)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            ./mvnw.cmd -B -ntp verify
          elif command -v mvn >/dev/null 2>&1; then
            mvn -B -ntp verify
          else
            echo "Add the Maven Wrapper to the repo (mvn -N wrapper:wrapper) or install Maven on the runner."
            exit 1
          fi

      - name: Upload JaCoCo reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-windows-jdk-17
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
          retention-days: 30

  # macOS: manual runs only (Actions → CI → Run workflow).
  build-macos-manual:
    name: Build and test — macOS (JDK 17)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw -B -ntp verify
          elif command -v mvn >/dev/null 2>&1; then
            mvn -B -ntp verify
          else
            echo "Add the Maven Wrapper to the repo (mvn -N wrapper:wrapper) or install Maven on the runner."
            exit 1
          fi

      - name: Upload JaCoCo reports (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-macos-jdk-17
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
          retention-days: 30
