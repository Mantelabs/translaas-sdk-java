name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/src/**/*.java'
      - '**/pom.xml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/src/**/*.java'
      - '**/pom.xml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            MVN=./mvnw
          elif command -v mvn >/dev/null 2>&1; then
            MVN=mvn
          else
            echo "Add the Maven Wrapper (mvn -N wrapper:wrapper) or install Maven."
            exit 1
          fi

          if [[ "${{ matrix.java-version }}" == "11" ]]; then
            EXTRA=(-Dmaven.test.skip=true)
            if grep -q '<spring-boot.version>4' translaas-sdk-spring-boot-starter/pom.xml; then
              EXTRA+=(-pl '!translaas-sdk-spring-boot-starter,!translaas-sdk-thymeleaf-spring-boot-starter')
            fi
            "$MVN" -B -ntp verify "${EXTRA[@]}"
          else
            "$MVN" -B -ntp verify
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: |
            **/target/site/jacoco/jacoco.xml
          flags: unit
          fail_ci_if_error: false
